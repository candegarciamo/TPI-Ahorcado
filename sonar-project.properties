# sonar-project.properties
# Configuración de SonarCloud para TPI-Ahorcado
# Docs: https://docs.sonarcloud.io/

sonar.projectKey=candegarciamo_TPI-Ahorcado
sonar.organization=candegarciamo

sonar.projectName=TPI-Ahorcado
sonar.projectVersion=1.0

# Carpeta raíz del código fuente a analizar
sonar.sources=src
sonar.tests=tests,features

# Excluir archivos generados y de configuración
sonar.exclusions=\
  dist/**,\
  coverage/**,\
  .nyc_output/**,\
  node_modules/**,\
  **/*.config.*,\
  **/jest.config.*

# Reporte de cobertura generado por Jest (LCOV)
# Jest debe correr con --coverage antes de que Sonar analice
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript: apuntar al tsconfig para análisis con tipos
sonar.typescript.tsconfigPath=tsconfig.json

# Encoding
sonar.sourceEncoding=UTF-8